[package]
name = "bhw-world"
description = "Blockheads world files, .bhworld archives and the world library for BH World Tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bhw-backup = { path = "../bhw-backup" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = { workspace = true }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
