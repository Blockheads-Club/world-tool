[package]
name = "bhw-editor"
description = "Edit model of BH World Tool's world editor: operations, selection, undo/redo, schematics and map render data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bhw-content = { path = "../bhw-content" }
bhw-lmdb = { path = "../bhw-lmdb" }
bhw-save = { path = "../bhw-save" }
flate2 = { workspace = true }
plist = "1.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
bhw-content = { path = "../bhw-content", features = ["test-util"] }
