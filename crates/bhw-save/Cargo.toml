[package]
name = "bhw-save"
description = "Contents of The Blockheads saves: world summaries, map previews, client <-> server conversion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bhw-lmdb = { path = "../bhw-lmdb" }
bhw-world = { path = "../bhw-world" }
thiserror = { workspace = true }
flate2 = { workspace = true }
plist = "1.7"
base64 = "0.22"
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
tempfile = "3"
lmdb-master-sys = "=0.2.6"

[lints]
workspace = true
