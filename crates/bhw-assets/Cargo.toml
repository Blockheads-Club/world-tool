[package]
name = "bhw-assets"
description = "Validates the user's own The Blockheads APK and extracts its graphics into a local cache for BH World Tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Exposes the synthetic-fixture builders to other crates' tests.
test-util = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3"
thiserror = { workspace = true }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
