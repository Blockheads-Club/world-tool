[package]
name = "bh-world-tool-app"
version = "0.1.0"
description = "BH World Tool: copy The Blockheads worlds between phones, Blockheads PC and this computer"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

# Own workspace root: keeps the GUI dependencies out of the crates workspace (and its coverage gate).
[workspace]

[lib]
name = "bh_world_tool_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13", features = ["blocking"] }
bhw-core = { path = "../../crates/bhw-core" }
bhw-device = { path = "../../crates/bhw-device" }
bhw-ios = { path = "../../crates/bhw-ios" }

[profile.release]
opt-level = 3
strip = true
lto = "thin"

# Encrypted iPhone backups use 10 million PBKDF2 rounds: keep the crypto fast in debug builds too.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
