[package]
name = "bh-world-tool-app"
version = "0.1.0"
description = "BH World Tool: copy The Blockheads worlds between phones, Blockheads PC and this computer"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
publish = false

# Own workspace root: keeps the GUI dependencies out of the crates workspace (and its coverage gate).
[workspace]

[lib]
name = "bh_world_tool_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
