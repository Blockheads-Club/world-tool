name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: crates fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-coverage:
    name: crates tests + coverage (cargo-llvm-cov, 100% lines + functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: swatinem/rust-cache@v2
      # bhw-backup cross-checks its .ab files against java.util.zip/javax.crypto (tests/java_xcheck.rs); without java
      # that test skips, so install it here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Runs every test of the workspace (real-device / real-save tests skip without their env vars) and fails below
      # 100 % lines or functions. Never lower the limits.
      - name: Test + measure
        run: |
          status=0
          cargo llvm-cov --workspace --locked --fail-under-lines 100 --fail-under-functions 100 \
            --lcov --output-path lcov.info || status=$?
          cargo llvm-cov report --summary-only | tee summary.txt
          { echo '### Crates coverage'; echo '```'; tail -n 3 summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-coverage
          path: |
            lcov.info
            summary.txt
          if-no-files-found: ignore

  lmdb-i686:
    name: bhw-lmdb vs real 32-bit LMDB (i686)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: swatinem/rust-cache@v2
        with:
          key: i686
      - name: 32-bit C toolchain (lmdb-master-sys builds LMDB for the target)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib
      - run: cargo test --locked --target i686-unknown-linux-gnu -p bhw-lmdb

  app:
    name: app svelte-check + vitest (100%)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Thresholds (100 % lines/branches/functions/statements) live in app/vite.config.ts.
      - run: bun run test

  e2e:
    name: app playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore

  scripts:
    name: release scripts (bun test, 100%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # coverageThreshold = 1.0 in bunfig.toml.
      - run: bun run test
      - name: Release config parses
        run: jq -e '.branches == ["dev"]' .releaserc.json

  tauri:
    name: src-tauri fmt + clippy + tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
        working-directory: app
      # app/src-tauri is its own workspace: the root fmt/clippy above do not reach it.
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - name: Build frontend (tauri-build needs frontendDist)
        run: bun run build
        working-directory: app
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Updater config is set
        run: jq -e '.plugins.updater.pubkey != "" and (.plugins.updater.endpoints | length) > 0' app/src-tauri/tauri.conf.json

  desktop-check:
    name: cargo check (${{ matrix.os }})
    # Release targets other than linux x64: catch per-platform breakage before a release.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - run: bun install --frozen-lockfile
        working-directory: app
      - name: Build frontend (tauri-build needs frontendDist)
        run: bun run build
        working-directory: app
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml --all-targets --locked
      - run: cargo test --workspace --locked
